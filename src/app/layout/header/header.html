<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand" aria-label="celesterosa — home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 28 28" width="26" height="26" fill="none">
          <rect x="2" y="11" width="3.2" height="6" rx="1.6" fill="var(--accent)" />
          <rect x="8" y="6" width="3.2" height="16" rx="1.6" fill="var(--accent)" />
          <rect x="14" y="2" width="3.2" height="24" rx="1.6" fill="var(--accent-2)" />
          <rect x="20" y="8" width="3.2" height="12" rx="1.6" fill="var(--accent-2)" />
        </svg>
      </span>
      <span class="brand-text">celeste<span class="brand-accent">rosa</span></span>
    </a>

    <nav class="nav" aria-label="Navigazione principale">
      <a routerLink="/catalogo" routerLinkActive="is-active">Catalogo</a>
      <a routerLink="/catalogo" [queryParams]="{ category: 'chitarre-e-bassi' }">Chitarre</a>
      <a routerLink="/catalogo" [queryParams]="{ category: 'tastiere-e-piano' }">Tastiere</a>
      <a routerLink="/catalogo" [queryParams]="{ category: 'studio-e-audio-pro' }">Studio</a>
      <a routerLink="/catalogo" [queryParams]="{ featured: true }">In evidenza</a>
      @if (session.isAdmin()) {
        <a routerLink="/admin" routerLinkActive="is-active" class="admin-link">Admin</a>
      }
    </nav>

    <div class="header-actions">
      <button
        type="button"
        class="icon-btn"
        (click)="theme.toggle()"
        [attr.aria-label]="theme.theme() === 'dark' ? 'Passa al tema chiaro' : 'Passa al tema scuro'"
      >
        @if (theme.theme() === 'dark') {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
            <circle cx="12" cy="12" r="4.2" />
            <path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8 6 18M18 6l1.8-1.8" stroke-linecap="round" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M20 14.3A8.2 8.2 0 0 1 9.7 4 8.2 8.2 0 1 0 20 14.3Z" stroke-linejoin="round" />
          </svg>
        }
      </button>

      <a [routerLink]="session.isAuthenticated() ? '/account' : '/accedi'" class="icon-btn" aria-label="Area cliente">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
          <circle cx="12" cy="8" r="3.6" />
          <path d="M5 20c0-3.6 3.1-6 7-6s7 2.4 7 6" stroke-linecap="round" />
        </svg>
      </a>

      @if (session.isAuthenticated()) {
        <button type="button" class="icon-btn" (click)="logout()" aria-label="Esci">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M15 4h2.5A1.5 1.5 0 0 1 19 5.5v13a1.5 1.5 0 0 1-1.5 1.5H15" stroke-linecap="round" stroke-linejoin="round" />
            <path d="M10 12h9M16 9l3 3-3 3M10 4H5.5A1.5 1.5 0 0 0 4 5.5v13A1.5 1.5 0 0 0 5.5 20H10" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      }

      <a routerLink="/carrello" class="icon-btn cart-btn" aria-label="Carrello">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7">
          <path d="M3 4h2l2.2 11.2a1.5 1.5 0 0 0 1.5 1.2h8.1a1.5 1.5 0 0 0 1.5-1.2L20.5 8H6.2" stroke-linecap="round" stroke-linejoin="round" />
          <circle cx="9.5" cy="20" r="1.3" fill="currentColor" stroke="none" />
          <circle cx="17.5" cy="20" r="1.3" fill="currentColor" stroke="none" />
        </svg>
        @if (cart.count() > 0) {
          <span class="cart-badge mono">{{ cart.count() }}</span>
        }
      </a>
    </div>
  </div>
</header>
